openapi: "3.1.0"
info:
  title: Test
  version: "1.0"
paths: {}
components:
  schemas:
    Result:
      oneOf:
        - $ref: "#/components/schemas/Success"
        - $ref: "#/components/schemas/Failure"
        - {}
      discriminator:
        propertyName: kind
    Success:
      $dynamicAnchor: Success
      type: object
      properties:
        kind:
          type: string
          enum:
            - success
        value:
          type: string
        chained:
          type: array
          items:
            $dynamicRef: "#Success"
      required:
        - kind
    Failure:
      type: object
      properties:
        kind:
          type: string
          enum:
            - failure
        message:
          type: string
      required:
        - kind
